# HTTP Server
server:
  port: 12032 # HTTP (Tomcat) port

spring:
  main:
    banner-mode: "off"
    lazy-initialization: true
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: 
        - W3C
  application:
    name: ts-order-other-service
  data:
    mongodb:
      host: ts-order-other-mongo
      #      username: user
      #      password: ${MONGODB_PASSWORD}
      database: ts
      port: 27017

