# HTTP Server
server:
  port: 17853 # HTTP (Tomcat) port

spring:
  main:
    banner-mode: "off"
    lazy-initialization: true
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: 
        - B3
        - W3C
  application:
    name: ts-notification-service
  mail:
    host: smtp.163.com
    port: 465
    username: fdse_microservices@163.com
    password: fdse1234
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: true
