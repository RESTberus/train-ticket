server:
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
  port: 18885 # HTTP (Tomcat) port

spring:
  main:
    banner-mode: "off"
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: 
        - W3C
  application:
    name: ts-cancel-service
