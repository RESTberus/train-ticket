server:
  port: 15678 # HTTP (Tomcat) port

spring:
  main:
    banner-mode: "off"
    lazy-initialization: true
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: x-request-id
    propagation:
      type: b3

  application:
    name: ts-verification-code-service
