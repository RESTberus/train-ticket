server:
  port: 12342

spring:
  application:
    name: ts-user-service
  main:
    banner-mode: "off"
    lazy-initialization: true
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type:
        - W3C
  data:
    mongodb:
      host: ts-user-mongo
      database: ts-user-mongo
      port: 27017
