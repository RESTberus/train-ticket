server:
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
  port: 18855

spring:
  main:
    banner-mode: "off"
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: 
        - W3C
  application:
    name: ts-food-map-service
  data:
    mongodb:
      host: ts-food-map-mongo
      #      username: user
      #      password: ${MONGODB_PASSWORD}
      database: ts
      port: 27017
