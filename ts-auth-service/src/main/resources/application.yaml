server:
  port: 12340
spring:
  application:
    name: ts-auth-service
  main:
    banner-mode: "off"
    lazy-initialization: true
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: b3
  data:
    mongodb:
      host: ts-auth-mongo
      database: ts-auth-mongo
      port: 27017
