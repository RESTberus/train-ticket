spring:
  main:
    banner-mode: "off"
  sleuth:
    trace-id128: true
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: 
        - x-request-id
      remote-fields:
        - x-request-id
    propagation:
      type: 
        - W3C
  application:
    name: ts-train-service
  data:
    mongodb:
      host: ts-train-mongo
      #      username: user
      #      password: ${MONGODB_PASSWORD}
      database: ts
      port: 27017

# HTTP Server
server:
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
  port: 14567 # HTTP (Tomcat) port
