# HTTP Server
server:
  port: 12346  # HTTP (Tomcat) port

spring:
  sleuth:
    sampler:
      probability: 1.0
    baggage:
      correlation-fields: x-request-id
    propagation:
      type: b3
  application:
    name: ts-travel-service
  data:
    mongodb:
      host: ts-travel-mongo
      #      username: user
      #      password: ${MONGODB_PASSWORD}
      database: ts
      port: 27017

