name: Build Microservices

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
      any_changes: ${{ steps.set-matrix.outputs.any_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Changed Services
        id: set-matrix
        run: |
          # Initialize variables
          SERVICES=()
          
          # Find all directories containing a Dockerfile
          ALL_SERVICES=$(find . -maxdepth 2 -name Dockerfile -exec dirname {} \; | sed 's|./||' | sort)
          
          # Determine if we should build all services
          BUILD_ALL="${{ github.event.inputs.build_all }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            BUILD_ALL="true"
          fi
          
          if [ "$BUILD_ALL" = "true" ]; then
            echo "Build all services requested."
            SERVICES=($ALL_SERVICES)
          else
            echo "Detecting changed services..."
            
            # Determine base for comparison
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="${{ github.event.before }}"
            else
              # Fallback: compare against main branch if history is available
              if git rev-parse origin/main >/dev/null 2>&1; then
                BASE_SHA=$(git rev-parse origin/main)
              else
                # Default to last commit if main is not found
                BASE_SHA="HEAD^"
              fi
            fi
            
            echo "Comparing HEAD against $BASE_SHA"
            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
            
            # Check for core files that should trigger all builds (Java parent POM, common library, build script)
            if echo "$CHANGED_FILES" | grep -qE "^(pom\.xml|ts-common/|build_images\.sh|\.github/workflows/build-services\.yml)"; then
              echo "Core files or common dependencies changed. Building all services."
              SERVICES=($ALL_SERVICES)
            else
              CHANGED_DIRS=$(echo "$CHANGED_FILES" | cut -d/ -f1 | sort -u)
              for dir in $CHANGED_DIRS; do
                if echo "$ALL_SERVICES" | grep -qx "$dir"; then
                  SERVICES+=("$dir")
                fi
              done
            fi
          fi
          
          # Filter out empty entries and format as JSON
          if [ ${#SERVICES[@]} -eq 0 ]; then
            echo "No services to build."
            echo "any_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            JSON_SERVICES=$(printf '%s\n' "${SERVICES[@]}" | jq -R . | jq -s -c .)
            echo "any_changes=true" >> $GITHUB_OUTPUT
            echo "services=$JSON_SERVICES" >> $GITHUB_OUTPUT
            echo "Build matrix: $JSON_SERVICES"
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.any_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Lowercase Repository Owner
        id: repo_owner
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: mode=max
          file: ${{ matrix.service }}/Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=registry,ref=ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service }}:latest
            type=registry,ref=ghcr.io/${{ steps.repo_owner.outputs.owner }}/${{ matrix.service }}:${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
